<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>音频播放器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236a8dff'/%3E%3Cstop offset='1' stop-color='%23a26bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M32 14v22m0 0c0-5-4-9-9-9m9 9c0-5 4-9 9-9' stroke='white' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3Cpath d='M20 42h24' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg1:#e8ebf2; --bg2:#dfe3ee;
  --glass:rgba(255,255,255,.62);
  --glass-strong:rgba(255,255,255,.82);
  --stroke:rgba(0,0,0,.08);
  --text:#1d1d1f; --text2:#6e6e73; --text3:#aeaeb2;
  --accent:#5472f0; --accent2:#7b5cf0;
  --grad:linear-gradient(135deg,#5472f0,#7b5cf0);
  --danger:#fa5151;
  --radius:16px;
  --nav-h:52px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg1:#16171d; --bg2:#101116;
    --glass:rgba(40,42,54,.60);
    --glass-strong:rgba(46,48,62,.85);
    --stroke:rgba(255,255,255,.09);
    --text:#f2f2f7; --text2:#a7aab3; --text3:#6b6e78;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  height:100dvh;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(123,92,240,.18), transparent 60%),
    radial-gradient(1000px 600px at -10% 110%, rgba(84,114,240,.16), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  user-select:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit}

/* ---------- 窗口骨架（Mac 窗口） ---------- */
.win{
  position:fixed;inset:0;display:flex;flex-direction:column;
  max-width:1180px;margin:0 auto;
}
@media (min-width:900px){
  body{padding:22px 0}
  .win{
    position:relative;height:100%;
    background:var(--glass);
    backdrop-filter:blur(30px) saturate(1.6);
    -webkit-backdrop-filter:blur(30px) saturate(1.6);
    border:1px solid var(--stroke);
    border-radius:20px;
    box-shadow:0 24px 70px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.25);
    overflow:hidden;
  }
}

/* ---------- 标题栏 ---------- */
.titlebar{
  height:var(--nav-h);flex:0 0 auto;
  display:flex;align-items:center;gap:10px;padding:0 16px;
  border-bottom:1px solid var(--stroke);
  position:relative;
  background:var(--glass-strong);
  backdrop-filter:blur(20px);
}
.lights{display:flex;gap:8px;padding-right:6px}
.light{width:12px;height:12px;border-radius:50%;position:relative}
.light.close{background:#ff5f57}.light.min{background:#febc2e}.light.max{background:#28c840}
@media (hover:hover){.light:hover::after{
  content:attr(data-g);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:rgba(0,0,0,.55)
}}
.win-title{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%;
}
@media (max-width:560px){.win-title{display:none}}

/* ---------- 主体两栏 ---------- */
.main{flex:1 1 auto;display:flex;min-height:0}
.sidebar{
  flex:0 0 300px;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--stroke);
}
.content{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}

/* 搜索框 */
.search-wrap{padding:12px 14px;flex:0 0 auto}
.search{
  display:flex;align-items:center;gap:8px;
  background:rgba(120,120,128,.14);border-radius:10px;padding:7px 10px;
}
.search svg{flex:0 0 auto;opacity:.45}
.search input{
  flex:1;border:none;background:none;outline:none;font-size:14px;color:var(--text);
  min-width:0;
}
.search input::placeholder{color:var(--text3)}
.search .clr{font-size:15px;color:var(--text3);width:18px;height:18px;line-height:17px;text-align:center;border-radius:50%;flex:0 0 auto}
@media (hover:hover){.search .clr:hover{background:rgba(120,120,128,.25)}}

/* 播放列表 */
.playlist{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:0 8px 90px}
.playlist::-webkit-scrollbar{width:8px}
.playlist::-webkit-scrollbar-thumb{background:rgba(120,120,128,.35);border-radius:4px;border:2px solid transparent;background-clip:content-box}
.group-title{
  font-size:11.5px;font-weight:700;color:var(--text3);
  padding:14px 10px 6px;letter-spacing:.5px;text-transform:uppercase;
  position:sticky;top:0;
  background:linear-gradient(var(--bg2) 82%,transparent);
}
@media (min-width:900px){.group-title{background:linear-gradient(var(--glass) 82%,transparent)}}
.track{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:10px;cursor:pointer;
  transition:background .12s;
}
.track:hover{background:rgba(120,120,128,.10)}
.track.playing{background:linear-gradient(135deg,rgba(84,114,240,.16),rgba(123,92,240,.16))}
.track .idx{
  flex:0 0 22px;font-size:12px;color:var(--text3);text-align:center;
  font-variant-numeric:tabular-nums;
}
.track .idx.eq{color:var(--accent);font-weight:700}
.track .meta{flex:1 1 auto;min-width:0}
.track .t-name{
  font-size:13.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.track.playing .t-name{color:var(--accent);font-weight:600}
.track .t-sub{font-size:11px;color:var(--text3);margin-top:1px}
.track .t-dur{
  flex:0 0 auto;display:flex;align-items:baseline;gap:3px;
  font-size:11.5px;color:var(--text3);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.track .t-dur .t-pos{color:var(--accent);font-weight:600}
.track .t-dur .t-sep{opacity:.5}
.track .t-dur .t-total{color:var(--text2)}
.track.playing .t-dur .t-total{color:var(--accent)}

/* ---------- 内容区：唱片 + 歌词位 ---------- */
.content-scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain}
.stage{
  flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 24px 16px;gap:22px;min-height:0;
}
.artwork{
  width:min(300px,58vw);aspect-ratio:1;border-radius:50%;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 18px 50px rgba(84,114,240,.38), inset 0 1px 0 rgba(255,255,255,.3);
  position:relative;overflow:hidden;flex:0 0 auto;
}
.artwork::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.28), transparent 45%),
    radial-gradient(circle at 75% 80%, rgba(0,0,0,.18), transparent 50%);
}
.artwork .disc{
  position:absolute;inset:0;border-radius:inherit;
  background:repeating-radial-gradient(circle at 50% 50%, transparent 0 9px, rgba(0,0,0,.045) 9px 10px);
  opacity:.6;
}
/* 圆形黑胶：中心轴点即可，大音符与 hub 叠放显乱 */
.artwork svg{display:none}
.art-wrap{position:relative;flex:0 0 auto;width:min(300px,58vw)}
.art-wrap .halo{
  position:absolute;inset:-14px;border-radius:50%;z-index:-1;
  background:radial-gradient(closest-side,rgba(123,92,240,.35),transparent);
  filter:blur(18px);opacity:0;transition:opacity .5s;
}
body.playing .art-wrap .halo{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
body.playing .artwork{animation:spin 60s linear infinite}

/* 旋转标记：一条淡淡的光痕，让慢速旋转可感知 */
.artwork .marker{
  position:absolute;left:50%;top:5%;width:2.4%;height:17%;
  transform:translateX(-50%);border-radius:999px;
  background:rgba(255,255,255,.22);filter:blur(.6px);
}

/* 黑胶中心轴（不随唱片旋转视觉上更稳） */
.artwork .hub{
  position:absolute;left:50%;top:50%;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:rgba(255,255,255,.92);z-index:2;
  box-shadow:0 2px 10px rgba(0,0,0,.22), inset 0 -2px 5px rgba(0,0,0,.08);
}
.artwork .hub::after{
  content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(30,32,40,.85);
}
body.playing .artwork svg{animation:none}

.now-title{
  font-size:17px;font-weight:700;text-align:center;max-width:560px;
  line-height:1.4;word-break:break-all;
}
.now-sub{font-size:12.5px;color:var(--text2);text-align:center;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}

/* ---------- 播放器控制条 ---------- */
.player{
  flex:0 0 auto;border-top:1px solid var(--stroke);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:var(--glass-strong);
  backdrop-filter:blur(24px) saturate(1.5);
}
.bar{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.bar .slider{flex:1}
input[type=range].sl{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;cursor:pointer;
}
input[type=range].sl::-webkit-slider-runnable-track{
  height:5px;border-radius:3px;
  background:linear-gradient(to right,var(--accent) var(--v,0%),rgba(120,120,128,.28) var(--v,0%));
}
input[type=range].sl::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:#fff;border:.5px solid rgba(0,0,0,.12);
  box-shadow:0 1px 4px rgba(0,0,0,.3);
  margin-top:-5px;
}
input[type=range].sl::-moz-range-track{height:5px;border-radius:3px;background:rgba(120,120,128,.28)}
input[type=range].sl::-moz-range-progress{height:5px;border-radius:3px;background:var(--accent)}
input[type=range].sl::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.3)}

.ctrls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px}
.cbtn{
  flex:0 0 auto;
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text);transition:background .15s,transform .1s;
}
@media (hover:hover){.cbtn:hover{background:rgba(120,120,128,.15)}}
.cbtn:active{transform:scale(.92)}
.cbtn.main{
  width:52px;height:52px;background:var(--grad);color:#fff;
  box-shadow:0 8px 22px rgba(84,114,240,.42);
}
.cbtn.main:active{transform:scale(.94)}
.cbtn.side{color:var(--text2)}
.cbtn.on{color:var(--accent)}
.cbtn svg{width:22px;height:22px}
.cbtn.main svg{width:26px;height:26px}

.ctrls2{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:600;color:var(--text2);
  background:rgba(120,120,128,.14);border-radius:999px;padding:5px 11px;
  font-variant-numeric:tabular-nums;flex:0 0 auto;
}
@media (hover:hover){.chip:hover{background:rgba(120,120,128,.22)}}
.chip.act{color:#fff;background:var(--grad)}

/* 倍速弹层 */
.pop{
  position:fixed;z-index:60;
  background:var(--glass-strong);backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid var(--stroke);border-radius:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
  padding:10px;min-width:230px;
}
.pop .p-title{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;padding:2px 8px 8px;display:flex;justify-content:space-between}
.pop .p-title b{color:var(--accent);font-variant-numeric:tabular-nums}
.preset-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 2px 8px}
.pbtn{
  font-size:12px;font-weight:600;color:var(--text2);
  background:rgba(120,120,128,.14);border-radius:8px;padding:6px 0;
  font-variant-numeric:tabular-nums;transition:background .12s;
}
.pbtn:hover{background:rgba(120,120,128,.24)}
.pbtn.on{color:#fff;background:var(--grad)}
.fine{
  display:flex;align-items:center;gap:10px;padding:4px 8px 2px;
}
.fine button{
  width:34px;height:30px;border-radius:8px;background:rgba(120,120,128,.14);
  font-size:15px;font-weight:700;color:var(--text2);flex:0 0 auto;
}
.fine button:hover{background:rgba(120,120,128,.24)}
.fine .fval{
  flex:1;text-align:center;font-size:15px;font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.pop .hint{font-size:10.5px;color:var(--text3);padding:6px 8px 0;text-align:center}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:rgba(30,30,36,.88);color:#fff;font-size:12.5px;padding:8px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:99;backdrop-filter:blur(10px);
  max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 空态 */
.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  color:var(--text3);font-size:13px;padding:20px;text-align:center;
}
.spin{width:26px;height:26px;border:3px solid rgba(120,120,128,.25);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}

/* ---------- 移动端 ---------- */
@media (max-width:899px){
  .win{position:fixed;inset:0}
  .main{flex-direction:column-reverse}
  .sidebar{
    flex:1 1 auto;border-right:none;border-top:1px solid var(--stroke);
    min-height:0;
  }
  .content{
    flex:0 0 auto;border-bottom:none;
    max-height:56dvh;
  }
  .stage{padding:16px 16px 8px;gap:14px}
  .artwork{width:min(210px,48vw)}
  .art-wrap{width:min(210px,48vw)}
  .now-title{font-size:15px}
  .player{padding:8px 14px calc(10px + env(safe-area-inset-bottom))}
  .ctrls{gap:14px;margin-top:2px}
  .cbtn{width:36px;height:36px}
  .cbtn.main{width:46px;height:46px}
  .ctrls2{margin-top:6px}
  .track{padding:8px 8px}
  .titlebar{padding:0 12px}
  .lights{gap:7px}
  .light{width:11px;height:11px}
  .content-scroll{overflow:visible}
  .stage{overflow:visible}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  /* 唱片旋转是持续装饰动画，压到 0.01ms 会表现为每秒数万圈的疯狂旋转 —— 排除之 */
  .artwork{animation-duration:60s!important}
}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">
    <div class="lights">
      <div class="light close" data-g="✕"></div>
      <div class="light min" data-g="–"></div>
      <div class="light max" data-g="⤢"></div>
    </div>
    <div class="win-title" id="winTitle">K 哥课程 · 音频中心</div>
  </div>

  <div class="main">
    <!-- 桌面：列表在左 / 移动：列表在下（column-reverse） -->
    <div class="sidebar">
      <div class="search-wrap">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="搜索课程…" autocomplete="off">
          <button class="clr" id="qclr" hidden>✕</button>
        </div>
      </div>
      <div class="playlist" id="list"></div>
    </div>

    <div class="content">
      <div class="content-scroll">
        <div class="stage">
          <div class="art-wrap">
            <div class="halo"></div>
            <div class="artwork">
              <div class="disc"></div>
              <div class="marker"></div>
              <div class="hub"></div>
            </div>
          </div>
          <div>
            <div class="now-title" id="nowTitle">未在播放</div>
            <div class="now-sub" id="nowSub">从左侧列表选择一个课程开始</div>
          </div>
        </div>
      </div>

      <div class="player">
        <div class="bar">
          <span id="tCur">0:00</span>
          <div class="slider"><input type="range" class="sl" id="seek" min="0" max="1000" value="0" step="1" aria-label="播放进度"></div>
          <span id="tDur">0:00</span>
        </div>
        <div class="ctrls">
          <button class="cbtn side" id="btnPrev" aria-label="上一首">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h2v12H7zM20 6v12l-9-6z"/></svg>
          </button>
          <button class="cbtn side" id="btnBack15" aria-label="后退15秒">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 9V4m0 5h5M4 9a9 9 0 1 1-2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="16.5" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor" font-family="sans-serif">15</text></svg>
          </button>
          <button class="cbtn main" id="btnPlay" aria-label="播放/暂停">
            <svg id="icPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <button class="cbtn side" id="btnFwd15" aria-label="前进15秒">
            <svg viewBox="0 0 24 24" fill="none"><path d="M20 9V4m0 5h-5M20 9a9 9 0 1 0 2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="16.5" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor" font-family="sans-serif">15</text></svg>
          </button>
          <button class="cbtn side" id="btnNext" aria-label="下一首">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 6h2v12h-2zM4 6l9 6-9 6z"/></svg>
          </button>
        </div>
        <div class="ctrls2">
          <button class="chip" id="btnMode" aria-label="播放模式">顺序</button>
          <button class="chip act" id="btnRate" aria-label="倍速">1.0×</button>
          <button class="chip" id="btnSleep" aria-label="定时关闭">定时</button>
        </div>
      </div>
    </div>
  </div>
</div>

<audio id="au" preload="metadata"></audio>
<div id="toast"></div>

<script>
'use strict';
/* ================= 状态 ================= */
const LS = {
  cur: 'ka.cur', pos: 'ka.pos', rate: 'ka.rate',
  mode: 'ka.mode', sleep: 'ka.sleep', vol: 'ka.vol'
};
const state = {
  items: [],            // 服务端列表
  curId: null,          // 当前曲目 id
  playing: false,
  seeking: false,       // 拖动进度条中
  mode: localStorage.getItem(LS.mode) || 'seq',   // seq|one|loop|shuffle
  sleepAt: 0,           // 定时播放结束的时间戳（ms），0=off
  sleepLeft: 0,         // 定时剩余秒（用于显示与恢复）
  sleepTick: null,
};
const $ = s => document.querySelector(s);
const au = $('#au');

/* ================= 工具 ================= */
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}
function fmt(s){
  if(!isFinite(s)||s<0) s=0;
  s = Math.floor(s);
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  return h? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
}
function fmtSize(n){
  if(n>1e9) return (n/1e9).toFixed(2)+' GB';
  if(n>1e6) return (n/1e6).toFixed(1)+' MB';
  return (n/1e3).toFixed(0)+' KB';
}
function setV(el, v){ el.style.setProperty('--v', (v*100).toFixed(2)+'%'); }

/* ================= 进度记忆 ================= */
const POS_KEY = id => LS.pos + '.' + id;
function savePos(){
  if(!state.curId || !isFinite(au.currentTime) || au.currentTime < 1) return;
  localStorage.setItem(POS_KEY(state.curId), String(Math.floor(au.currentTime)));
}
function loadPos(id){
  const v = parseInt(localStorage.getItem(POS_KEY(id)) || '0', 10);
  return isFinite(v) ? v : 0;
}
function clearPos(id){
  if(id) localStorage.removeItem(POS_KEY(id));
}
setInterval(savePos, 3000);
window.addEventListener('beforeunload', savePos);
/* 正在播放的行：已听时长实时刷新（不整列重绘） */
setInterval(()=>{
  if(!state.curId || !state.playing || !isFinite(au.currentTime)) return;
  const el = document.getElementById('tr-'+cssId(state.curId));
  if(!el) return;
  let box = el.querySelector('.t-dur');
  if(!box) return;
  let pos = box.querySelector('.t-pos');
  if(!pos){
    box.insertAdjacentHTML('afterbegin',
      `<span class="t-pos"></span><span class="t-sep">/</span>`);
    pos = box.querySelector('.t-pos');
  }
  pos.textContent = fmt(au.currentTime);
}, 1000);

/* ================= 数据加载 ================= */
async function boot(){
  try{
    const r = await fetch('/api/list');
    const d = await r.json();
    state.items = d.items || [];
  }catch(e){
    $('#list').innerHTML = `<div class="empty"><div class="spin"></div><div>加载失败，请刷新重试（提取任务可能仍在进行）</div></div>`;
    return;
  }
  if(state.items.length === 0){
    $('#list').innerHTML = `<div class="empty"><div>音频目录为空<br><span style="font-size:11px">请检查 .env 的 AUDIO_DIR 配置</span></div></div>`;
    setTimeout(boot, 5000);
    return;
  }
  renderList();
  restoreLast();
}

/* ================= 列表渲染 ================= */
function visibleItems(){
  const q = $('#q').value.trim().toLowerCase();
  if(!q) return state.items;
  return state.items.filter(it =>
    it.name.toLowerCase().includes(q) || (it.group||'').toLowerCase().includes(q));
}
function renderList(){
  const list = $('#list');
  const vis = visibleItems();
  if(vis.length === 0){
    list.innerHTML = `<div class="empty" style="position:static;padding:40px 20px"><div>无匹配课程</div></div>`;
    return;
  }
  let html = '', lastGroup = null, idx = 0;
  for(const it of vis){
    idx++;
    if(it.group !== lastGroup){
      html += `<div class="group-title">${esc(it.group || '未分组')}</div>`;
      lastGroup = it.group;
    }
    const pos = loadPos(it.id);
    const durTxt = it.dur ? fmt(it.dur) : '·';
    const posTxt = pos > 2 ? fmt(pos) : '';
    html += `<div class="track" data-id="${it.id}" id="tr-${cssId(it.id)}">
      <div class="idx">${idx}</div>
      <div class="meta">
        <div class="t-name">${esc(it.name)}</div>
        <div class="t-sub">${esc(it.group||'')} · ${fmtSize(it.size)} · ${it.ext.toUpperCase()}</div>
      </div>
      <div class="t-dur">${posTxt ? `<span class="t-pos">${posTxt}</span><span class="t-sep">/</span>` : ''}<span class="t-total">${durTxt}</span></div>
    </div>`;
  }
  list.innerHTML = html;
  list.querySelectorAll('.track').forEach(el => {
    el.addEventListener('click', () => play(el.dataset.id));
  });
  markPlaying();
}
function cssId(id){ return 'i' + btoa(unescape(encodeURIComponent(id))).replace(/[^a-zA-Z0-9]/g,''); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function markPlaying(){
  document.querySelectorAll('.track.playing').forEach(el=>el.classList.remove('playing'));
  document.querySelectorAll('.idx.eq').forEach(el=>{el.classList.remove('eq');});
  if(!state.curId) return;
  const el = document.getElementById('tr-'+cssId(state.curId));
  if(el){
    el.classList.add('playing');
    const idx = el.querySelector('.idx');
    if(idx && state.playing){
      idx.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      idx.classList.add('eq');
    }
  }
}

/* ================= 播放控制 ================= */
function findIdx(id){ return state.items.findIndex(it => it.id === id); }
function nextId(dir){
  if(state.items.length === 0) return null;
  if(state.mode === 'shuffle'){
    if(state.items.length === 1) return state.curId;
    let n;
    do { n = state.items[Math.floor(Math.random()*state.items.length)].id; } while(n === state.curId);
    return n;
  }
  const i = findIdx(state.curId);
  if(i === -1) return state.items[0].id;
  const j = i + dir;
  if(j >= state.items.length) return null; // 结束
  if(j < 0) return state.items[0].id;
  return state.items[j].id;
}
function play(id, opts={}){
  const it = state.items[findIdx(id)];
  if(!it){ toast('曲目不存在'); return; }
  state.curId = id;
  localStorage.setItem(LS.cur, id);
  au.src = it.url;
  const p = loadPos(id);
  if(p > 2 && !opts.fresh) {
    au.currentTime = p;
    toast(`已从上次进度 ${fmt(p)} 继续`);
  }
  au.playbackRate = state.rate;
  au.play().catch(()=>{});
  updateNow(it);
  markPlaying();
}
function updateNow(it){
  $('#nowTitle').textContent = it.name;
  $('#nowSub').innerHTML = `${esc(it.group||'')} · ${fmtSize(it.size)} · <span id="nowRateTxt">${state.rate.toFixed(1)}×</span>`;
  $('#winTitle').textContent = it.name + ' — K 哥课程';
}
function togglePlay(){
  if(!state.curId){
    const vis = visibleItems();
    if(vis.length) play(vis[0].id); else toast('播放列表为空');
    return;
  }
  if(au.paused) au.play().catch(()=>{}); else au.pause();
}
function step(dir){
  const nid = nextId(dir);
  if(!nid){ toast(dir>0 ? '已经是最后一个了' : '已经是第一个了'); return; }
  play(nid);
}
function seekBy(sec){
  if(!isFinite(au.duration)) return;
  au.currentTime = Math.max(0, Math.min(au.duration - 0.5, au.currentTime + sec));
}

/* ================= audio 事件 ================= */
au.addEventListener('play', ()=>{ state.playing=true; document.body.classList.add('playing'); $('#icPlay').style.display='none'; $('#icPause').style.display=''; markPlaying(); });
au.addEventListener('pause', ()=>{ state.playing=false; document.body.classList.remove('playing'); $('#icPlay').style.display=''; $('#icPause').style.display='none'; markPlaying(); savePos(); });
au.addEventListener('loadedmetadata', ()=>{ $('#tDur').textContent = fmt(au.duration); });
au.addEventListener('durationchange', ()=>{ $('#tDur').textContent = fmt(au.duration); });
au.addEventListener('timeupdate', ()=>{
  if(!state.seeking && isFinite(au.duration) && au.duration>0){
    const v = au.currentTime/au.duration;
    $('#seek').value = Math.round(v*1000);
    setV($('#seek'), v);
  }
  $('#tCur').textContent = fmt(au.currentTime);
});
au.addEventListener('ended', ()=>{
  savePos();
  clearPos(state.curId);
  if(state.mode === 'one'){ au.currentTime=0; au.play().catch(()=>{}); }
  else{
    const nid = nextId(1);
    if(nid) play(nid);
    else { state.playing=false; document.body.classList.remove('playing'); }
  }
});
au.addEventListener('error', ()=>{ if(state.curId) toast('音频加载失败'); });

/* ================= 进度条 ================= */
const seek = $('#seek');
seek.addEventListener('input', ()=>{
  state.seeking = true;
  const v = seek.value/1000;
  setV(seek, v);
  if(isFinite(au.duration)) $('#tCur').textContent = fmt(v*au.duration);
});
seek.addEventListener('change', ()=>{
  if(isFinite(au.duration)){
    au.currentTime = (seek.value/1000)*au.duration;
    savePos();
  }
  state.seeking = false;
});

/* ================= 倍速 ================= */
state.rate = clampRate(parseFloat(localStorage.getItem(LS.rate)) || 1);
function clampRate(r){
  if(!isFinite(r)) return 1;
  return Math.max(0.1, Math.min(4, r));  // 只夹边界，保留 0.75/1.25 等精确预设
}
function applyRate(r, round){
  state.rate = clampRate(r);
  if(round) state.rate = clampRate(Math.round(state.rate*10)/10);  // 仅微调时取 1 位小数
  localStorage.setItem(LS.rate, String(state.rate));
  au.playbackRate = state.rate;
  $('#btnRate').textContent = state.rate.toFixed(1)+'×';
  const rt = document.getElementById('nowRateTxt');
  if(rt) rt.textContent = state.rate.toFixed(1)+'×';
  if(popEl && popEl.parentNode) buildRatePop();
}
const PRESETS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3, 4];
let popEl = null;
function closePop(){
  if(popEl){ popEl.remove(); popEl=null; }
  document.removeEventListener('pointerdown', popOutside);
}
function popOutside(ev){
  if(!popEl) return;
  if(popEl.contains(ev.target)) return;
  if($('#btnRate').contains(ev.target)) return; // 按钮自身走 toggle
  closePop();
}
function buildRatePop(){
  popEl.innerHTML = `
    <div class="p-title">播放速度 <b id="popCur">${state.rate.toFixed(1)}×</b></div>
    <div class="preset-grid">
      ${PRESETS.map(p=>`<button class="pbtn ${p===state.rate?'on':''}" data-p="${p}">${p}</button>`).join('')}
    </div>
    <div class="fine">
      <button id="rMinus">−</button>
      <div class="fval" id="fval">${state.rate.toFixed(1)}×</div>
      <button id="rPlus">＋</button>
    </div>
    <div class="hint">0.1 ~ 4.0，步进 0.1</div>`;
  popEl.querySelectorAll('.pbtn').forEach(b=>b.addEventListener('click',()=>{applyRate(parseFloat(b.dataset.p));}));
  popEl.querySelector('#rMinus').addEventListener('click',()=>applyRate(state.rate-0.1,true));
  popEl.querySelector('#rPlus').addEventListener('click',()=>applyRate(state.rate+0.1,true));
}
function toggleRatePop(){
  if(popEl){ closePop(); return; }
  popEl = document.createElement('div');
  popEl.className = 'pop';
  document.body.appendChild(popEl);
  buildRatePop();
  const r = $('#btnRate').getBoundingClientRect();
  const pw = 250, ph = 190;
  let left = Math.min(Math.max(8, r.left + r.width/2 - pw/2), innerWidth - pw - 8);
  let top = r.top - ph - 8;
  if(top < 60) top = r.bottom + 8;
  popEl.style.left = left+'px'; popEl.style.top = top+'px';
  document.addEventListener('pointerdown', popOutside);
}
$('#btnRate').addEventListener('click', toggleRatePop);

/* ================= 播放模式 ================= */
const MODES = [
  {k:'seq', label:'顺序', tip:'顺序播放'},
  {k:'loop', label:'循环', tip:'列表循环'},
  {k:'one', label:'单曲', tip:'单曲循环'},
  {k:'shuffle', label:'随机', tip:'随机播放'},
];
function cycleMode(){
  const i = MODES.findIndex(m=>m.k===state.mode);
  const m = MODES[(i+1)%MODES.length];
  state.mode = m.k;
  localStorage.setItem(LS.mode, m.k);
  $('#btnMode').textContent = m.label;
  toast(m.tip);
}
$('#btnMode').addEventListener('click', cycleMode);

/* ================= 定时关闭 ================= */
const SLEEPS = [5, 10, 15, 30, 60];
function cycleSleep(){
  if(state.sleepTick){
    clearInterval(state.sleepTick); state.sleepTick=null;
    state.sleepAt = 0;
    $('#btnSleep').classList.remove('act');
    $('#btnSleep').textContent = '定时';
    toast('已取消定时');
    return;
  }
  const mins = SLEEPS[state._si = ((state._si||0)+1) % (SLEEPS.length+1)];
  if(mins === undefined){
    $('#btnSleep').classList.remove('act');
    $('#btnSleep').textContent = '定时';
    return;
  }
  state.sleepAt = Date.now() + mins*60*1000;
  $('#btnSleep').classList.add('act');
  $('#btnSleep').textContent = mins+'分';
  toast(`${mins} 分钟后停止播放`);
  if(state.sleepTick) clearInterval(state.sleepTick);
  state.sleepTick = setInterval(()=>{
    const left = state.sleepAt - Date.now();
    if(left <= 0){
      au.pause(); savePos();
      clearInterval(state.sleepTick); state.sleepTick=null; state.sleepAt=0;
      $('#btnSleep').classList.remove('act');
      $('#btnSleep').textContent = '定时';
      toast('定时结束，已停止播放');
    } else {
      $('#btnSleep').textContent = Math.ceil(left/60000)+'分';
    }
  }, 5000);
}
$('#btnSleep').addEventListener('click', cycleSleep);

/* ================= 恢复上次 ================= */
function restoreLast(){
  const cid = localStorage.getItem(LS.cur);
  if(cid && findIdx(cid) !== -1){
    const it = state.items[findIdx(cid)];
    state.curId = cid;
    au.src = it.url;
    const p = loadPos(cid);
    $('#tDur').textContent = '';
    updateNow(it);
    markPlaying();
    if(p > 2){
      $('#tCur').textContent = fmt(p);
      au.addEventListener('loadedmetadata', function once(){
        au.removeEventListener('loadedmetadata', once);
        au.currentTime = Math.min(p, Math.max(0, au.duration - 1));
        $('#seek').value = Math.round(au.currentTime/Math.max(1,au.duration)*1000);
        setV($('#seek'), au.currentTime/Math.max(1,au.duration));
      }, {once:true});
    }
  }
}

/* ================= 搜索 ================= */
let qT;
$('#q').addEventListener('input', e=>{
  $('#qclr').hidden = !e.target.value;
  clearTimeout(qT);
  qT = setTimeout(renderList, 160);
});
$('#qclr').addEventListener('click', ()=>{
  $('#q').value=''; $('#qclr').hidden = true; renderList(); $('#q').focus();
});

/* ================= 按钮 ================= */
$('#btnPlay').addEventListener('click', togglePlay);
$('#btnPrev').addEventListener('click', ()=>step(-1));
$('#btnNext').addEventListener('click', ()=>step(1));
$('#btnBack15').addEventListener('click', ()=>seekBy(-15));
$('#btnFwd15').addEventListener('click', ()=>seekBy(15));
document.addEventListener('keydown', e=>{
  if(e.target.tagName === 'INPUT') return;
  if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if(e.code === 'ArrowLeft') seekBy(-15);
  else if(e.code === 'ArrowRight') seekBy(15);
  else if(e.code === 'ArrowUp'){ applyRate(state.rate + 0.1); toast('倍速 '+state.rate.toFixed(1)+'×'); }
  else if(e.code === 'ArrowDown'){ applyRate(state.rate - 0.1); toast('倍速 '+state.rate.toFixed(1)+'×'); }
});

/* ================= init ================= */
$('#btnMode').textContent = (MODES.find(m=>m.k===state.mode)||MODES[0]).label;
$('#btnRate').textContent = state.rate.toFixed(1)+'×';
boot();
</script>
</body>
</html>
